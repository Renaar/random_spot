# Publie l'application sur GitHub Pages.
#
# Ce workflow n'est utile QUE si Pages est réglé sur « Source: GitHub Actions »
# (Settings > Pages). Si vous avez choisi « Deploy from a branch », GitHub gère
# le déploiement lui-même et ce fichier peut rester tel quel, inactif.
#
# La toute première activation de Pages doit se faire dans l'interface web :
# le jeton d'Actions n'a pas le droit de créer le site.
name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site (uniquement l'application)
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
